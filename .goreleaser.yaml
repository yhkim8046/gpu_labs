# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: gpu-lab

before:
  hooks:
    - go mod verify

builds:
  - id: gpu-lab
    main: ./cmd/gpu-lab
    binary: gpu-lab
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/gpu-lab/gpu-lab/internal/version.Version={{ .Version }} -X github.com/gpu-lab/gpu-lab/internal/version.Commit={{ .Commit }} -X github.com/gpu-lab/gpu-lab/internal/version.BuildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  - id: gpu
    main: ./cmd/gpu-lab
    binary: gpu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/gpu-lab/gpu-lab/internal/version.Version={{ .Version }} -X github.com/gpu-lab/gpu-lab/internal/version.Commit={{ .Commit }} -X github.com/gpu-lab/gpu-lab/internal/version.BuildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - gpu-lab
      - gpu
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
