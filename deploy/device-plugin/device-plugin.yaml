apiVersion: v1
kind: Namespace
metadata:
  name: gpu-lab-system
  labels:
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: gpu-lab-system
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
        app.kubernetes.io/part-of: gpu-lab
        app.kubernetes.io/managed-by: gpu-lab
    spec:
      terminationGracePeriodSeconds: 10
      nodeSelector:
        gpu.lab/type: fake
      containers:
        - name: device-plugin
          image: gpu-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/nvidia-device-plugin"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GPU_COUNT
              value: "8"
            - name: RESOURCE_NAME
              value: nvidia.com/gpu
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
