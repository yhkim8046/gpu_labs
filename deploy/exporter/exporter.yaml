apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-gpu-exporter
  namespace: gpu-lab-system
  labels:
    app.kubernetes.io/name: mock-gpu-exporter
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mock-gpu-exporter
  namespace: gpu-lab-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gpu-lab-scenario"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mock-gpu-exporter
  namespace: gpu-lab-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mock-gpu-exporter
subjects:
  - kind: ServiceAccount
    name: mock-gpu-exporter
    namespace: gpu-lab-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mock-gpu-exporter
  namespace: gpu-lab-system
  labels:
    app.kubernetes.io/name: mock-gpu-exporter
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-gpu-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-gpu-exporter
        app.kubernetes.io/part-of: gpu-lab
        app.kubernetes.io/managed-by: gpu-lab
    spec:
      serviceAccountName: mock-gpu-exporter
      nodeSelector:
        gpu.lab/type: fake
      containers:
        - name: exporter
          image: gpu-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/mock-gpu-exporter"]
          ports:
            - name: http
              containerPort: 9400
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GPU_COUNT
              value: "8"
            - name: LISTEN_ADDRESS
              value: ":9400"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-gpu-exporter
  namespace: gpu-lab-system
  labels:
    app.kubernetes.io/name: mock-gpu-exporter
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mock-gpu-exporter
  ports:
    - name: http
      port: 9400
      targetPort: http
      protocol: TCP
