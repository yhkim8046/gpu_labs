apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-lab-training-dashboard
  namespace: gpu-lab-monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: gpu-lab-training-dashboard
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
data:
  gpu-lab-distributed-training.json: |
    {
      "__inputs":[{"name":"DS_PROMETHEUS","label":"Prometheus","type":"datasource","pluginId":"prometheus","pluginName":"Prometheus"}],
      "annotations":{"list":[]},"editable":true,"graphTooltip":1,"refresh":"5s","schemaVersion":39,"style":"dark","tags":["gpu-lab","distributed-training"],
      "templating":{"list":[{"name":"rank","label":"Rank","type":"query","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"query":"label_values(gpu_lab_training_step, rank)","includeAll":true,"multi":true,"allValue":".*","refresh":1},{"name":"pod","label":"Pod","type":"query","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"query":"label_values(gpu_lab_training_step{rank=~\"$rank\"}, pod)","includeAll":true,"multi":true,"allValue":".*","refresh":1},{"name":"node","label":"Node","type":"query","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"query":"label_values(gpu_lab_training_step{rank=~\"$rank\",pod=~\"$pod\"}, node)","includeAll":true,"multi":true,"allValue":".*","refresh":1}]},
      "time":{"from":"now-15m","to":"now"},"title":"GPU Lab Distributed Training","uid":"gpu-lab-distributed-training","version":1,
      "panels":[
        {"id":1,"type":"text","title":"운영 실습 안내","gridPos":{"h":4,"w":24,"x":0,"y":0},"options":{"mode":"markdown","content":"## Synthetic distributed training\nCPU 기반 deterministic worker와 HTTP control-plane AllReduce 실습입니다. CUDA/NCCL/RDMA/NVLink 성능을 의미하지 않습니다.\n\n조사 순서: **rank health → step/loss → AllReduce latency/errors → checkpoint lag → logs/events**."},"transparent":true},
        {"id":2,"type":"timeseries","title":"Progress / loss","gridPos":{"h":8,"w":12,"x":0,"y":4},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"refId":"A","expr":"gpu_lab_training_step{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"}","legendFormat":"step r{{rank}}"},{"refId":"B","expr":"gpu_lab_training_loss{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"}","legendFormat":"loss r{{rank}}"}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]}},
        {"id":3,"type":"stat","title":"Ranks healthy","gridPos":{"h":8,"w":6,"x":12,"y":4},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"refId":"A","expr":"sum(gpu_lab_training_rank_up{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"})","legendFormat":"up"}],"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value"}},
        {"id":4,"type":"timeseries","title":"AllReduce latency","gridPos":{"h":8,"w":6,"x":18,"y":4},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"refId":"A","expr":"gpu_lab_training_allreduce_seconds{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"}","legendFormat":"r{{rank}}"}],"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]}},
        {"id":5,"type":"timeseries","title":"Throughput / samples","gridPos":{"h":8,"w":12,"x":0,"y":12},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"refId":"A","expr":"rate(gpu_lab_training_samples_total{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"}[1m])","legendFormat":"samples/s r{{rank}}"}],"fieldConfig":{"defaults":{"unit":"ops"},"overrides":[]}},
        {"id":6,"type":"timeseries","title":"Restarts / AllReduce errors","gridPos":{"h":8,"w":12,"x":12,"y":12},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"refId":"A","expr":"gpu_lab_training_restarts_total{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"}","legendFormat":"restarts r{{rank}}"},{"refId":"B","expr":"increase(gpu_lab_training_allreduce_errors_total{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"}[5m])","legendFormat":"errors r{{rank}}"}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]}},
        {"id":7,"type":"timeseries","title":"Checkpoint lag","gridPos":{"h":8,"w":12,"x":0,"y":20},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"refId":"A","expr":"gpu_lab_training_step{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"} - gpu_lab_training_checkpoint_step{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"}","legendFormat":"lag r{{rank}}"}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]}},
        {"id":8,"type":"stat","title":"Straggler active","gridPos":{"h":8,"w":6,"x":12,"y":20},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"refId":"A","expr":"max(gpu_lab_training_straggler_active{rank=~\"$rank\",pod=~\"$pod\",node=~\"$node\"})","legendFormat":"active"}],"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1}]}},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value"}},
        {"id":9,"type":"text","title":"Troubleshooting","gridPos":{"h":8,"w":6,"x":18,"y":20},"options":{"mode":"markdown","content":"1. `gpu training status`로 replicas와 rank를 확인합니다.\n2. `kubectl -n gpu-lab-demo get events --sort-by=.lastTimestamp`로 이벤트를 확인합니다.\n3. `gpu training logs --rank N`으로 worker를 조사합니다.\n4. 종료 후 `gpu training recover`, 마지막에 `gpu training reset`을 실행합니다."}}
      ]
    }
