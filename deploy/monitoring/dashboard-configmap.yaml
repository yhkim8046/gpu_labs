apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-lab-dashboard
  namespace: gpu-lab-monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: gpu-lab-dashboard
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
data:
  gpu-lab-overview.json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Operating boundary",
          "description": "The lab projects DCGM-like signals; values are synthetic and should be correlated with Kubernetes and exporter state.",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "content": "## GPU Lab operational view\n\nThis dashboard follows the same investigation order used for an NVIDIA/DCGM Kubernetes incident: **availability → capacity → utilization and memory → temperature and power → XID/ECC/PCIe symptoms → workload allocation**. The `gpu_lab_*` series are synthetic training signals; confirm real incidents with node status, device-plugin state, exporter targets, `nvidia-smi`, and kernel logs.",
            "mode": "markdown"
          },
          "transparent": true
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Average GPU utilization",
          "description": "Average utilization across the selected node and GPU filters. Sustained saturation can indicate demand or insufficient capacity.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg(gpu_lab_gpu_utilization_percent{node=~\"$node\",gpu=~\"$gpu\"})",
              "legendFormat": "average"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Peak VRAM pressure",
          "description": "Highest used-to-total memory ratio in the selected scope.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(100 * gpu_lab_gpu_memory_used_bytes{node=~\"$node\",gpu=~\"$gpu\"} / gpu_lab_gpu_memory_total_bytes{node=~\"$node\",gpu=~\"$gpu\"})",
              "legendFormat": "peak used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Unhealthy GPUs",
          "description": "Count of selected GPUs reporting health 0.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(gpu_lab_gpu_health{node=~\"$node\",gpu=~\"$gpu\"} == 0)",
              "legendFormat": "unhealthy"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Exporter targets up",
          "description": "Prometheus scrape availability for the dcgm-exporter ServiceMonitor target.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{service=\"dcgm-exporter\"})",
              "legendFormat": "scrape targets"
            },
            {
              "refId": "B",
              "expr": "sum(gpu_lab_exporter_up{node=~\"$node\"})",
              "legendFormat": "metric projections"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Active scenario",
          "description": "Non-zero series identify the currently applied scenario on the selected nodes.",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (scenario) (gpu_lab_scenario_info{node=~\"$node\"})",
              "legendFormat": "{{scenario}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Scenario generation",
          "description": "Monotonic scenario application generation from the exporter projection.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(gpu_lab_scenario_generation{node=~\"$node\"})",
              "legendFormat": "generation"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Allocated GPUs",
          "description": "Number of selected GPU series marked as reserved by a workload.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(gpu_lab_gpu_allocated{node=~\"$node\",gpu=~\"$gpu\"})",
              "legendFormat": "allocated"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Allocated but idle",
          "description": "Selected GPUs reserved by a workload with utilization below five percent.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((gpu_lab_gpu_allocated{node=~\"$node\",gpu=~\"$gpu\"} == 1) and (gpu_lab_gpu_utilization_percent{node=~\"$node\",gpu=~\"$gpu\"} < 5))",
              "legendFormat": "idle allocations"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "GPU capacity headroom",
          "description": "Total allocatable GPUs minus allocated GPUs for the selected nodes.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(gpu_lab_node_gpu_allocatable{node=~\"$node\"}) - sum(gpu_lab_gpu_allocated{node=~\"$node\"})",
              "legendFormat": "headroom"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "GPU utilization by device",
          "description": "Sustained high utilization can be healthy demand or a capacity signal; compare it with allocation and queue state.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_gpu_utilization_percent{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "VRAM usage by device",
          "description": "Used-to-total memory ratio; high pressure can precede allocation failures even when a GPU is schedulable.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * gpu_lab_gpu_memory_used_bytes{node=~\"$node\",gpu=~\"$gpu\"} / gpu_lab_gpu_memory_total_bytes{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Temperature",
          "description": "Thermal warning and critical thresholds for GPU board temperature.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_gpu_temperature_celsius{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Power draw",
          "description": "Power draw by GPU; correlate sustained draw with power violations, temperature, and throttle state.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_gpu_power_watts{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Active throttling by reason",
          "description": "The synthetic throttle gauge is 0 or 1 and carries a reason label, similar to a reduced clock-event view.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_gpu_throttle_active{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}} / {{reason}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "XID code",
          "description": "Current non-zero XID codes are device fault signals; correlate them with health and ECC before recovery.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 30
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_gpu_xid_code{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "GPU health status",
          "description": "Synthetic DCGM-style status: 0 PASS, 10 WARN, 20 FAIL.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 30
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_gpu_health_status{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 20,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Double-bit ECC counter",
          "description": "Cumulative uncorrectable ECC errors by GPU. Any non-zero value requires investigation and usually isolation.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 30
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_gpu_ecc_dbe_total{node=~\"$node\",gpu=~\"$gpu\"}",
              "legendFormat": "{{node}} / {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Power-limit violations (5m increase)",
          "description": "Recent counter increase highlights fresh power-limit events; use the raw counter in Prometheus for historical context.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 38
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
