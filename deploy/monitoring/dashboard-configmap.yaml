apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-lab-dashboard
  namespace: gpu-lab-monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: gpu-lab-dashboard
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
data:
  gpu-lab-overview.json: |
    {
      "__inputs": [{"name": "DS_PROMETHEUS", "label": "Prometheus", "type": "datasource", "pluginId": "prometheus", "pluginName": "Prometheus"}],
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {"type": "timeseries", "title": "GPU Utilization (%)", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_utilization_percent", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}},
        {"type": "timeseries", "title": "VRAM Usage (%)", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "100 * gpu_lab_gpu_memory_used_bytes / gpu_lab_gpu_memory_total_bytes", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}},
        {"type": "timeseries", "title": "Temperature (°C)", "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_temperature_celsius", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "celsius"}, "overrides": []}},
        {"type": "timeseries", "title": "Power (W)", "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_power_watts", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "watt"}, "overrides": []}},
        {"type": "timeseries", "title": "XID Code", "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_xid_code", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"type": "timeseries", "title": "Double-bit ECC Errors", "gridPos": {"h": 8, "w": 8, "x": 0, "y": 13}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_ecc_dbe_total", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"type": "timeseries", "title": "Power Violations", "gridPos": {"h": 8, "w": 8, "x": 8, "y": 13}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_power_violation_total", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"type": "timeseries", "title": "PCIe Replay Errors", "gridPos": {"h": 8, "w": 8, "x": 16, "y": 13}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_pcie_replay_total", "legendFormat": "{{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"type": "timeseries", "title": "GPU Allocation vs Utilization", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_gpu_allocated", "legendFormat": "allocated {{node}} / {{gpu}}"}, {"expr": "gpu_lab_gpu_utilization_percent / 100", "legendFormat": "utilization {{node}} / {{gpu}}"}], "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}},
        {"type": "timeseries", "title": "GPU Capacity vs Allocatable", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "gpu_lab_node_gpu_capacity", "legendFormat": "capacity {{node}}"}, {"expr": "gpu_lab_node_gpu_allocatable", "legendFormat": "allocatable {{node}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"type": "stat", "title": "Healthy GPUs", "gridPos": {"h": 5, "w": 8, "x": 0, "y": 29}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "sum(gpu_lab_gpu_health)", "legendFormat": "healthy"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"type": "stat", "title": "Active Scenario", "gridPos": {"h": 5, "w": 8, "x": 8, "y": 29}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "count by (scenario) (gpu_lab_scenario_info)", "legendFormat": "{{scenario}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"type": "stat", "title": "Exporter Targets", "gridPos": {"h": 5, "w": 8, "x": 16, "y": 29}, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "targets": [{"expr": "sum(up{service=\"dcgm-exporter\"})", "legendFormat": "up"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}}
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["gpu-lab", "synthetic"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "title": "GPU Lab Overview (Synthetic)",
      "uid": "gpu-lab-overview",
      "version": 1,
      "weekStart": ""
    }
