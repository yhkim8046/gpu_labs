apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-lab-alerts
  namespace: gpu-lab-monitoring
  labels:
    app.kubernetes.io/name: gpu-lab-alerts
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
spec:
  groups:
    - name: gpu-lab.rules
      rules:
        - alert: GPULabHighUtilization
          expr: avg by (node) (gpu_lab_gpu_utilization_percent) > 80
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "GPU utilization is high on {{ $labels.node }}"
            description: "Synthetic GPU utilization has stayed above 80 percent for one minute."
        - alert: GPULabVRAMPressure
          expr: (gpu_lab_gpu_memory_used_bytes / gpu_lab_gpu_memory_total_bytes) > 0.9
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "VRAM pressure on {{ $labels.node }}"
            description: "Synthetic VRAM usage is above 90 percent."
        - alert: GPULabThermalThrottling
          expr: gpu_lab_gpu_temperature_celsius > 90
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "GPU temperature is critical on {{ $labels.node }}"
            description: "Synthetic GPU temperature is above 90 degrees Celsius; inspect utilization, power, and throttling symptoms."
        - alert: GPULabXIDPresent
          expr: gpu_lab_gpu_xid_code > 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Synthetic GPU XID on {{ $labels.node }}"
            description: "Inspect the XID code and GPU health metric."
        - alert: GPULabGPUUnhealthy
          expr: gpu_lab_gpu_health == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Synthetic GPU unhealthy on {{ $labels.node }}"
            description: "The synthetic dcgm-exporter reports an unhealthy virtual GPU."
        - alert: GPULabDoubleBitECC
          expr: gpu_lab_gpu_ecc_dbe_total > 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Uncorrectable ECC error on {{ $labels.node }}"
            description: "Double-bit ECC errors are present; drain the workload and isolate the GPU."
        - alert: GPULabPowerThrottle
          expr: gpu_lab_gpu_throttle_active{reason="power_cap"} == 1 or increase(gpu_lab_gpu_power_violation_total[5m]) > 0
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "GPU is power throttling on {{ $labels.node }}"
            description: "Power-limit violations or an active power-cap throttle require clock, power, and workload investigation."
        - alert: GPULabPCIeReplay
          expr: increase(gpu_lab_gpu_pcie_replay_total[5m]) > 0
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "PCIe replay errors on {{ $labels.node }}"
            description: "PCIe replay counters increased; inspect link state, host bridge, cable, and hardware errors."
        - alert: GPULabAllocatedGPUIdle
          expr: (gpu_lab_gpu_allocated == 1) and (gpu_lab_gpu_utilization_percent < 5)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Allocated GPU is idle on {{ $labels.node }}"
            description: "A workload reserves a GPU while utilization remains below 5 percent."
        - alert: GPULabGPUCapacityMismatch
          expr: gpu_lab_node_gpu_capacity != gpu_lab_node_gpu_allocatable
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "GPU capacity and allocatable counts differ on {{ $labels.node }}"
            description: "Reconcile device-plugin registration, kubelet Node status, and scheduler capacity."
        - alert: GPULabExporterDown
          expr: up{service="dcgm-exporter"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "GPU exporter is down on {{ $labels.instance }}"
            description: "Prometheus cannot scrape the synthetic dcgm-exporter."
        - alert: GPULabSchedulingFailure
          expr: kube_pod_status_phase{namespace="gpu-lab-demo", pod=~"gpu-lab-(scheduling-failure|node-selector-mismatch|fragmentation-target)", phase="Pending"} == 1
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "GPU workload {{ $labels.pod }} is Pending"
            description: "Inspect scheduler events, node selectors, and per-node GPU allocatable capacity."
