apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-lab-fabric-dashboard
  namespace: gpu-lab-monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: gpu-lab-fabric-dashboard
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: gpu-lab
data:
  gpu-lab-ib-fabric.json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["gpu-lab", "infiniband", "rdma", "synthetic"],
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "query": "label_values(gpu_lab_ib_port_state, node)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 1
          },
          {
            "name": "hca",
            "label": "HCA",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "query": "label_values(gpu_lab_ib_port_state{node=~\"$node\"}, hca)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 1
          },
          {
            "name": "port",
            "label": "Port",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "query": "label_values(gpu_lab_ib_port_state{node=~\"$node\",hca=~\"$hca\"}, port)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 1
          },
          {
            "name": "link_layer",
            "label": "Link layer",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "query": "label_values(gpu_lab_ib_port_state{node=~\"$node\",hca=~\"$hca\",port=~\"$port\"}, link_layer)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 1
          }
        ]
      },
      "time": {"from": "now-15m", "to": "now"},
      "title": "GPU Lab InfiniBand / RDMA Fabric",
      "uid": "gpu-lab-ib-fabric",
      "version": 1,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Synthetic boundary — 실제 IB 장비가 아님",
          "description": "The gpu_lab_ib_* and gpu_lab_rdma_* series are deterministic lab signals.",
          "gridPos": {"h": 5, "w": 24, "x": 0, "y": 0},
          "options": {
            "mode": "markdown",
            "content": "## ⚠ Synthetic InfiniBand/RDMA boundary\n\n이 대시보드는 HCA·포트·링크·RDMA 오류와 분산학습 영향을 운영 순서대로 연습하기 위한 **synthetic simulation**입니다. `gpu_lab_ib_*`와 `gpu_lab_rdma_*` 값은 실제 케이블, 스위치, NIC, OFED, NCCL, RDMA 대역폭을 측정하지 않습니다. 실제 장애 판정은 `ibstat`, `perfquery`, `rdma statistic`, `mlxlink`, NCCL 로그와 장비 topology를 별도로 확인하세요.\n\n조사 순서: **port health/state → negotiated rate → physical/link errors → transmit congestion → RDMA retry/timeout → training fabric delay/errors → AllReduce/step**."
          },
          "transparent": true
        },
        {
          "id": 2,
          "type": "table",
          "title": "Port health / state",
          "description": "Current synthetic port availability and state labels for the selected node, HCA, port, and link layer.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_ib_port_state{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}",
              "legendFormat": "{{node}} / {{hca}}:{{port}} {{state}} / {{physical_state}}"
            },
            {
              "refId": "B",
              "expr": "gpu_lab_ib_port_up{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}",
              "legendFormat": "up {{node}} / {{hca}}:{{port}}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"},
            "overrides": []
          },
          "options": {"showHeader": true, "footer": {"show": false}}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Negotiated link rate",
          "description": "Synthetic negotiated rate. A value below 100 Gbps is the lab degraded-rate signal.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_ib_link_rate_gbps{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}",
              "legendFormat": "{{node}} / {{hca}}:{{port}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Gbps",
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 100}, {"color": "green", "value": 200}]}
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "TX / RX throughput",
          "description": "Counter rates converted to gigabits per second for the selected ports.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "rate(gpu_lab_ib_tx_bytes_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[1m]) * 8 / 1e9",
              "legendFormat": "TX {{node}} / {{hca}}:{{port}}"
            },
            {
              "refId": "B",
              "expr": "rate(gpu_lab_ib_rx_bytes_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[1m]) * 8 / 1e9",
              "legendFormat": "RX {{node}} / {{hca}}:{{port}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "Gbps", "min": 0}, "overrides": []}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Physical / link errors",
          "description": "Rates of symbol errors, link recovery events, and link-down events.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "rate(gpu_lab_ib_symbol_errors_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[5m])",
              "legendFormat": "symbol errors {{node}} / {{hca}}:{{port}}"
            },
            {
              "refId": "B",
              "expr": "rate(gpu_lab_ib_link_error_recovery_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[5m])",
              "legendFormat": "link recovery {{node}} / {{hca}}:{{port}}"
            },
            {
              "refId": "C",
              "expr": "rate(gpu_lab_ib_link_downed_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[5m])",
              "legendFormat": "link down {{node}} / {{hca}}:{{port}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "TX wait / discards congestion",
          "description": "Transmit wait and discard counter rates indicate synthetic queue pressure.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "rate(gpu_lab_ib_xmit_wait_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[5m])",
              "legendFormat": "xmit wait {{node}} / {{hca}}:{{port}}"
            },
            {
              "refId": "B",
              "expr": "rate(gpu_lab_ib_xmit_discards_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[5m])",
              "legendFormat": "xmit discards {{node}} / {{hca}}:{{port}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "RDMA retries / timeouts",
          "description": "Retry and timeout rates for synthetic RDMA traffic.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "rate(gpu_lab_rdma_retries_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[5m])",
              "legendFormat": "retries {{node}} / {{hca}}:{{port}}"
            },
            {
              "refId": "B",
              "expr": "rate(gpu_lab_rdma_timeouts_total{node=~\"$node\",hca=~\"$hca\",port=~\"$port\",link_layer=~\"$link_layer\"}[5m])",
              "legendFormat": "timeouts {{node}} / {{hca}}:{{port}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Training fabric delay / fault",
          "description": "Synthetic fabric fault mode and delay projected into the training workers.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 29},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_training_fabric_delay_seconds",
              "legendFormat": "fabric delay rank {{rank}}"
            },
            {
              "refId": "B",
              "expr": "gpu_lab_training_fabric_fault_active",
              "legendFormat": "fault {{mode}} rank {{rank}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Training AllReduce / progress correlation",
          "description": "Compare fabric symptoms with collective latency and rank progress.",
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 29},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [
            {
              "refId": "A",
              "expr": "gpu_lab_training_allreduce_seconds",
              "legendFormat": "AllReduce rank {{rank}}"
            },
            {
              "refId": "B",
              "expr": "gpu_lab_training_step",
              "legendFormat": "step rank {{rank}}"
            },
            {
              "refId": "C",
              "expr": "gpu_lab_training_fabric_retries_total",
              "legendFormat": "fabric retries rank {{rank}}"
            },
            {
              "refId": "D",
              "expr": "gpu_lab_training_fabric_errors_total",
              "legendFormat": "fabric errors rank {{rank}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        }
      ]
    }
