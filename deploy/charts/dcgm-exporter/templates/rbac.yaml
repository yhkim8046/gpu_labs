apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcgm-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    gpu-lab.io/implementation: synthetic
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: Helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dcgm-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    gpu-lab.io/implementation: synthetic
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gpu-lab-scenario"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dcgm-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    gpu-lab.io/implementation: synthetic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dcgm-exporter
subjects:
  - kind: ServiceAccount
    name: dcgm-exporter
    namespace: {{ .Release.Namespace }}
