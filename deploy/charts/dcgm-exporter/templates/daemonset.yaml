apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    gpu-lab.io/implementation: synthetic
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: gpu-lab
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  template:
    metadata:
      annotations:
        gpu-lab.io/implementation: synthetic
      labels:
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/part-of: gpu-lab
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: dcgm-exporter
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: exporter
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/dcgm-exporter"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GPU_COUNT
              value: {{ .Values.gpuCount | quote }}
            - name: LISTEN_ADDRESS
              value: ":{{ .Values.service.port }}"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
