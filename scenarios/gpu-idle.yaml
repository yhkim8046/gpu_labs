apiVersion: gpu-lab.io/v1alpha1
kind: Scenario
metadata:
  name: gpu-idle
spec:
  description: A workload reserves a GPU but produces almost no utilization
  metrics:
    gpu_utilization_percent: 2
    gpu_memory_used_percent: 5
    temperature_celsius: 38
    power_watts: 35
  actions:
    - type: create_gpu_workload
      name: gpu-lab-idle-workload
      gpu_count: 1
      wait_for_ready: true
